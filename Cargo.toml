[package]
name = "simplenotes"
version = "0.1.0"
edition = "2021"
description = "Lightweight desktop sticky notes for Windows with automatic saving"
license = "MIT"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Accessibility",
  "Win32_System_SystemServices", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
